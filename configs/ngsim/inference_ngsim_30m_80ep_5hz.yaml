# NGSIM: Inference Original (mlp) 30m 80ep @ 5Hz
input_data:
  dataset: ['ngsim']
  subject: vehicle
  train_folder: train
  val_folder: val
  test_folder: test
  observed_steps: 15
  prtediction_step: 25
  points_per_position: 2
  reduction_ratio: 16
  relation_neighbor_limit_meter: 30.0
  augment: false

training:
  save_model: false
  train: false
  output_projection: false
  device: 'cuda:0'
  batch_size: 16
  epoches: 80
  experiment_root: 'experiments/vehicle'
  run_name: 'inference_ngsim_30m_80ep_5hz'
  backbone: 'transformer'
  output_type: 'mlp'
  model_dir: 'experiments/vehicle/train/train_ngsim_30m_80ep'
  learning_rate: 0.01
  num_heads: 2
  num_layers: 2
  ffl: 16
  dropout: 0.2
