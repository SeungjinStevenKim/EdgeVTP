# NGSIM: One-Shot Bezier + data augmentation (scale_only) 40ep
input_data:
  dataset: ['ngsim']
  subject: vehicle
  train_folder: train_1k
  val_folder: val_1k
  test_folder: test_1k
  observed_steps: 15
  prtediction_step: 25
  points_per_position: 2
  reduction_ratio: 16
  augment: true
  augment_mode: scale_only
  augment_rotation: null

training:
  save_model: true
  train: true
  validation_interval: 1
  device: 'cuda:0'
  batch_size: 16
  weight_decay: 0.0005
  milestones: [10, 30, 45]
  epoches: 40
  experiment_root: 'experiments/vehicle'
  run_name: 'train_ngsim_aug_oneshot_bezier_40ep'
  backbone: 'transformer'
  output_type: 'one_shot_bezier'
  model_dir: 'experiments/vehicle/train/train_ngsim_aug_oneshot_bezier_40ep'
  learning_rate: 0.01
  num_heads: 2
  num_layers: 2
  ffl: 16
  dropout: 0.2
