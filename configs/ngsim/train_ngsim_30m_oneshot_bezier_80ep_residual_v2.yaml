# NGSIM: One-Shot Bezier + 30M filter 80ep + Residual Separation (Cx/Delta) v2 @ 5Hz
# frame_subsample: 2 = 10Hz->5Hz (take every 2nd frame)
input_data:
  dataset: ['ngsim']
  subject: vehicle
  frame_subsample: 2
  train_folder: train
  val_folder: val
  test_folder: test
  observed_steps: 15
  prtediction_step: 25
  points_per_position: 2
  reduction_ratio: 16
  relation_neighbor_limit_meter: 30.0
  augment: false

training:
  save_model: true
  train: true
  validation_interval: 1
  output_projection: false
  use_residual_separation: true
  device: 'cuda:0'
  batch_size: 16
  weight_decay: 0.0005
  milestones: [40, 60, 70]
  epoches: 80
  experiment_root: 'experiments/vehicle'
  run_name: 'train_ngsim_30m_oneshot_bezier_80ep_residual_v2_5hz'
  backbone: 'transformer'
  output_type: 'one_shot_bezier'
  model_dir: 'experiments/vehicle/train/train_ngsim_30m_oneshot_bezier_80ep_residual_v2_5hz'
  learning_rate: 0.01
  num_heads: 2
  num_layers: 2
  ffl: 16
  dropout: 0.2
