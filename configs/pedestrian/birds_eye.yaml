input_data:
  dataset: ['eth', 'hotel', 'univ', 'zara1', 'zara2']
  subject: 'pedestrian' 
  train_folder: 'train'
  val_folder: 'test'
  test_folder: 'test'
  observed_steps : 8
  prtediction_step : 12
  points_per_position : 2
  reduction_ratio: 16 
  

training:
  save_model : True
  train : True
  validation_interval : 1
  save_folder : 'pb'
  learning_rate : 0.01
  milestones : [10,30,45]
  epoches : 20
  device : 'cuda:0'
  weight_decay : 0.001
  model_dir : "models/pb/2026-02-11_14-12-22"
  batch_size : 256
  num_heads: 2
  num_layers: 2
  ffl: 16
  dropout : 0.7

  


