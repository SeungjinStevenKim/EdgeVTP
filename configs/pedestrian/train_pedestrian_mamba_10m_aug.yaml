# Pedestrian: Mamba VT-Former (10M filter + Aug)
input_data:
  dataset: ['eth', 'hotel', 'univ', 'zara1', 'zara2']
  subject: 'pedestrian'
  use_kan: 'head_kan'
  train_folder: 'train'
  val_folder: 'test'
  test_folder: 'test'
  observed_steps: 8
  prtediction_step: 12
  points_per_position: 2
  reduction_ratio: 16
  relation_neighbor_limit_meter: 10.0
  augment: true

training:
  save_model: true
  train: true
  validation_interval: 1
  device: 'cuda:0'
  batch_size: 256
  weight_decay: 0.001
  milestones: [10, 30, 45]
  epoches: 20
  experiment_root: 'experiments/pedestrian'
  run_name: 'train_mamba_10m_v1'
  selected_model: 'mamba'

  model_profiles:
    original:
      backbone: 'transformer'
      output_type: 'mlp'
      model_dir: 'experiments/pedestrian/train/train_original_10m_v2'
      learning_rate: 0.01
      num_heads: 2
      num_layers: 2
      ffl: 16
      dropout: 0.7
    kan_best:
      backbone: 'transformer'
      output_type: 'kan'
      model_dir: 'experiments/pedestrian/train/train_kan_15m_v1'
      learning_rate: 0.01
      num_heads: 2
      num_layers: 2
      ffl: 16
      dropout: 0.7
    mamba:
      backbone: 'mamba'
      output_type: 'mlp'
      model_dir: 'experiments/pedestrian/train/train_mamba_10m_v1'
      learning_rate: 0.01
      num_heads: 2
      num_layers: 2
      ffl: 16
      dropout: 0.7
      mamba_d_state: 16
      mamba_d_conv: 4
      mamba_expand: 2
