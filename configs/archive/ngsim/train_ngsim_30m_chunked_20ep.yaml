# NGSIM: 30m filter, chunked (5-waypoint stages) 20ep
input_data:
  dataset: ['ngsim']
  subject: vehicle
  train_folder: train_1k
  val_folder: val_1k
  test_folder: test_1k
  observed_steps: 15
  prtediction_step: 25
  points_per_position: 2
  reduction_ratio: 16
  relation_neighbor_limit_meter: 30.0
  augment: false

training:
  save_model: true
  train: true
  validation_interval: 1
  device: 'cuda:0'
  batch_size: 16
  weight_decay: 0.0005
  milestones: [10, 30, 45]
  epoches: 20
  experiment_root: 'experiments/vehicle'
  run_name: 'train_ngsim_30m_chunked_20ep'
  backbone: 'transformer'
  output_type: 'mlp'
  use_chunked: true
  chunk_size: 5
  model_dir: 'experiments/vehicle/train/train_ngsim_30m_chunked_20ep'
  learning_rate: 0.01
  num_heads: 2
  num_layers: 2
  ffl: 16
  dropout: 0.2
