input_data:
  augment: false
  dataset:
  - ngsim
  frame_subsample: 2
  observed_steps: 15
  points_per_position: 2
  prtediction_step: 25
  reduction_ratio: 16
  relation_neighbor_limit_k: 16
  relation_neighbor_limit_meter: 20.0
  relation_neighbor_random_sample: true
  subject: vehicle
  test_folder: test
  train_folder: train
  val_folder: val
training:
  backbone: transformer
  batch_size: 16
  device: cuda:0
  dropout: 0.2
  epoches: 80
  experiment_root: experiments/vehicle
  ffl: 16
  learning_rate: 0.01
  milestones:
  - 40
  - 60
  - 70
  model_dir: experiments/vehicle/train/train_ngsim_20m_oneshot_bezier_80ep_residual_v2_tcn_5hz_k16
  num_heads: 2
  num_layers: 2
  output_projection: false
  output_type: one_shot_bezier
  run_name: train_ngsim_20m_oneshot_bezier_80ep_residual_v2_tcn_5hz_k16
  save_model: true
  tcn_kernel_size: 3
  tcn_num_layers: 2
  train: true
  use_residual_separation: true
  use_tcn: true
  validation_interval: 1
  weight_decay: 0.0005
