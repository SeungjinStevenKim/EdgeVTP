input_data:
  augment: true
  augment_mode: scale_only
  augment_rotation: null
  dataset:
  - ngsim
  observed_steps: 15
  points_per_position: 2
  prtediction_step: 25
  reduction_ratio: 16
  subject: vehicle
  test_folder: test_1k
  train_folder: train_1k
  val_folder: val_1k
training:
  backbone: transformer
  batch_size: 16
  device: cuda:0
  dropout: 0.2
  epoches: 20
  experiment_root: experiments/vehicle
  ffl: 16
  learning_rate: 0.01
  milestones:
  - 10
  - 30
  - 45
  model_dir: experiments/vehicle/train/train_ngsim_aug_oneshot_bezier_20ep
  num_heads: 2
  num_layers: 2
  output_type: one_shot_bezier
  run_name: train_ngsim_aug_oneshot_bezier_20ep
  save_model: true
  train: true
  validation_interval: 1
  weight_decay: 0.0005
